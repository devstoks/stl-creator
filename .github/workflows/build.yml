# Gera o executável para Windows e Mac em máquinas de verdade do GitHub, roda os testes e o teste de fumaça
# do executável empacotado. O .zip pronto para distribuir sai em "Artifacts" da execução.
name: Build e testes (Windows + Mac)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            exe: dist_exe\Biscuit3DStudio\Biscuit3DStudio.exe
          - os: macos-14   # Apple Silicon
            nome: macos
            exe: dist_exe/Biscuit3DStudio/Biscuit3DStudio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Dependências Python
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt pyinstaller
      - name: Interface (frontend)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Testes automatizados
        working-directory: backend
        run: python -m pytest -q tests
      - name: Gerar executável
        run: python scripts/build_exe.py
      - name: Teste de fumaça do executável
        run: python scripts/smoke_test.py "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Biscuit3DStudio-${{ matrix.nome }}
          path: dist_exe/Biscuit3DStudio-${{ matrix.nome }}.zip
          if-no-files-found: error
